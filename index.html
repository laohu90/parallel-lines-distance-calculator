          "@type": "Question",
          "name": "What is the formula for the distance between two parallel lines?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "When two parallel lines are expressed in standard form with identical coefficients Ax + By + C1 = 0 and Ax + By + C2 = 0, the perpendicular distance between them is d = |C1 - C2| / sqrt(A^2 + B^2). If the coefficients of x and y are proportional by a factor k, one equation must be divided by k first before applying the formula."
          }
        },
        {
          "@type": "Question",
          "name": "How does Completing the Square prove the parallel lines distance formula?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "By parameterizing an arbitrary point Q on the second line in terms of x and expressing the squared Euclidean distance to a fixed point P on the first line as a quadratic function S(x) = a x^2 + bx + c. Completing the square produces the vertex form S(x) = a(x - x*)^2 + (C1 - C2)^2 / (A^2 + B^2). Since the squared term is greater than or equal to zero, the vertex constant is the absolute minimum distance squared."
          }
        },
        {
          "@type": "Question",
          "name": "Why must the coefficients of x and y be identical before subtracting constants?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The formula relies on projecting the displacement between lines onto the unit normal vector (A, B) / sqrt(A^2 + B^2). If one equation is multiplied by a scaling factor k, its normal vector length is scaled, which invalidates the metric unless normalized first."
          }
        }
      ]
    }
